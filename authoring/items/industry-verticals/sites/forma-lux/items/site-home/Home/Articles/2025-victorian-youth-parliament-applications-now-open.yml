        <h2>Young people across Victoria: your voice matters</h2>
        <p>Applications for the <strong>2025 Victorian Youth Parliament</strong> are now open — an opportunity for <strong>16–25-year-olds</strong> to shape policy, build leadership skills, and connect with peers from right across our communities. Whether you’re passionate about the environment, education, health, or social justice, this is a chance to turn ideas into action.</p>
        
        <h2>What the Youth Parliament is and who can apply</h2>
        <p>The Victorian Youth Parliament gives young people firsthand experience of democratic processes by researching, debating and presenting Bills on issues that matter to youth. We welcome applicants aged 16–25 from every background — first-time public speakers, community advocates, LGBTIQA+ young people, those from regional and remote areas, and young people with disability.</p>
        <p>No prior political experience is required: enthusiasm, curiosity and a commitment to listening to your community are what count.</p>
        <p><strong>Note:</strong> Applications are assumed to be open from <strong>1 March to 30 April 2025</strong>, with the program running through mid-2025 and culminating in a sitting week at Parliament House in Melbourne in <strong>September 2025</strong>. Please check the official Y Victoria webpage for the most current dates and application details.</p>
        
        <h2>What to expect and how Y Victoria supports you</h2>
        <p>Selected participants will take part in training sessions on public speaking, policy research and parliamentary procedure. Y Victoria provides mentoring, workshops and opportunities to link your Bill to real community needs so your work has lasting impact.</p>
        <p>We also aim to remove barriers to participation: travel bursaries, online participation options, and supports for accessibility are available where needed — talk to us about what you need, and we’ll do our best to help.</p>
        <p>This is more than a week in Parliament. Past participants have started community campaigns, joined youth advisory groups, and taken leadership roles in schools and local clubs. The skills you build — teamwork, critical thinking, and persuasive communication — are useful no matter where you go next.</p>
        
        <h2>Voices from the community</h2>
        <blockquote>
          <p>“One of the most powerful parts of Youth Parliament was seeing how ideas from my local community turned into a real debate in Parliament,” says Sarah Nguyen, Y Victoria Youth Programs Manager. “We’re committed to making this process welcoming and practical — giving every young person the training and support they need to speak confidently, represent their peers, and create change.”</p>
        </blockquote>
        
        <h2>How to apply and get involved</h2>
        <p>Ready to step up? Visit <a href="https://yvictoria.org.au/youth-parliament">yvictoria.org.au/youth-parliament</a> to read the full eligibility criteria, download the application form, and view available supports.</p>
        <p>If you need help with your application or want to discuss accessibility or travel support, email <a href="mailto:youth@yvictoria.org.au">youth@yvictoria.org.au</a> or call your local Y Victoria centre — we’re here to help.</p>
        
        <h2>Call to action</h2>
        <p><strong>Apply today</strong> and bring your community’s voice to the table. Share this opportunity with young people, parents, schools and local groups so more diverse voices can be part of shaping Victoria’s future. Together we can empower young leaders and build stronger, fairer communities.</p>
