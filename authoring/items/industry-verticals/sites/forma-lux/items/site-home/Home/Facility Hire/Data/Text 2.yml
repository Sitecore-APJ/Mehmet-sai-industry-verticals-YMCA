        <div class="ck-content"><p>Whether you're a community group looking for a new venue or a business wanting to organise a space for a team-building day, we've got a variety of spaces for you. Managed by the Y, our modern facilities cater for a range of needs such as indoor and outdoor sport, social activities and corporate events.</p><h3>Our spaces</h3><ul style="list-style-type:disc;"><li>Community hubs (including multi-purpose rooms ideal for corporate meetings, social events and more)</li><li>Indoor courts (single and double courts suitable for a variety of sports)</li><li>Outdoor courts (available for a range of sports such as basketball and netball)</li><li>Sports ovals (including soccer and cricket pitches)</li></ul></div>
