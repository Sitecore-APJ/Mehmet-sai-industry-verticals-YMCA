      Value: Y Victoria abre inscripciones para sus Campamentos de Verano 2026, invitando a las familias victorianas a asegurar un lugar en un verano de diversión, pertenencia y crecimiento.
    - ID: "25bed78c-4957-4165-998a-ca1b52f67497"
      Hint: __Created
      Value: 20260520T012311Z
    - ID: "4e0720e9-9d50-4ddc-87cf-ecd65e8e94c8"
      Hint: NavigationTitle
      Value: Inscripciones Abiertas para los Campamentos de Verano 2026 de Y Victoria
    - ID: "52807595-0f8f-4b20-8d2a-cb71d28c6103"
      Hint: __Owner
      Value: |
        sitecore\mehmet.vanli@sitecore.com
    - ID: "56a52337-177b-46b4-ae72-6b9083bb6700"
      Hint: Content
      Value: <p>Las familias victorianas ya pueden inscribirse en los Campamentos de Verano 2026 de Y Victoria, con el programa comenzando el lunes 14 de diciembre de 2026 en ubicaciones de campamento por toda Victoria. Diseñados para niños y jóvenes de 8 a 16 años, los campamentos ofrecen una experiencia de vacaciones de verano llena de aventura, actividades al aire libre, nuevas amistades y muchas oportunidades para probar algo nuevo.</p><p>Los campamentos están basados en el compromiso de Y de crear espacios acogedores donde los jóvenes se sientan apoyados, incluidos y animados a intentarlo. Los campistas pueden esperar una mezcla de trabajo en equipo, creatividad y tiempo en la naturaleza, con actividades diseñadas para ayudarles a construir confianza, fortalecer la independencia y crear recuerdos duraderos. Ya sea que un joven llegue con amigos o venga solo, la experiencia se trata de pertenencia, diversión y crecimiento personal.</p><p>Para Y Victoria, el programa es parte de una misión mucho más grande. Como organización sin ánimo de lucro, Y reinvierte en programas que ayudan a las comunidades a prosperar, con un fuerte enfoque en el empoderamiento juvenil, comunidades saludables y conexión. Los campamentos de verano son una de las formas en que Y ayuda a los jóvenes a alejarse de las pantallas y participar en experiencias compartidas significativas que pueden tener un impacto real mucho después de que terminen las vacaciones.</p><p>“El campamento de verano da a los jóvenes la oportunidad de descubrir de lo que son capaces, hacer nuevas conexiones y sentirse parte de algo más grande”, dijo un Líder de Programas de Y Victoria. “Es increíble ver la confianza que construyen en solo unos días.”</p><p>Se espera que los lugares se llenen rápidamente, por lo que se anima a las familias a inscribirse temprano para la temporada 2026. Para obtener más información y asegurar un lugar, visite el sitio web de Y Victoria y diríjase a la sección de Campamentos hoy mismo.</p>
