    - ID: "56a52337-177b-46b4-ae72-6b9083bb6700"
      Hint: Content
      Value: "<p>Victorian families can now register for Y Victoria’s 2026 Summer Camps, with the program starting on Monday 14 December 2026 at camp locations across Victoria. Designed for children and young people aged 8 to 16, the camps offer a summer holiday experience filled with adventure, outdoor activities, new friendships and plenty of opportunities to try something new.</p><p>The camps are built around the Y’s commitment to creating welcoming spaces where young people feel supported, included and encouraged to have a go. Campers can expect a mix of teamwork, creativity and time in nature, with activities designed to help them build confidence, strengthen independence and make lasting memories. Whether a young person is arriving with friends or coming along solo, the experience is all about belonging, fun and personal growth.</p><p>For Y Victoria, the program is part of a much bigger mission. As a not-for-profit organisation, the Y reinvests in programs that help communities thrive, with a strong focus on youth empowerment, healthy communities and connection. Summer camps are one way the Y helps young people step away from screens and into meaningful shared experiences that can have a real impact long after the holidays end.</p><p>“Summer camp gives young people a chance to discover what they’re capable of, make new connections and feel part of something bigger,” said a Y Victoria Program Leader. “It’s amazing to see the confidence they build in just a few days.”</p><p>Places are expected to fill quickly, so families are encouraged to register early for the 2026 season. To learn more and secure a spot, visit the Y Victoria website and head to the Camps section today.</p>"
