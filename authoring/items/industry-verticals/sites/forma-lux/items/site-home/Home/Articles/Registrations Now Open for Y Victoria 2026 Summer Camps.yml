      Value: Y Victoria ouvre les inscriptions pour ses camps d'été 2026, invitant les familles victoriennes à réserver une place pour un été de plaisir, d'appartenance et de développement.
    - ID: "25bed78c-4957-4165-998a-ca1b52f67497"
      Hint: __Created
      Value: 20260520T012311Z
    - ID: "4e0720e9-9d50-4ddc-87cf-ecd65e8e94c8"
      Hint: NavigationTitle
      Value: Inscriptions ouvertes pour les camps d'été 2026 de Y Victoria
    - ID: "52807595-0f8f-4b20-8d2a-cb71d28c6103"
      Hint: __Owner
      Value: |
        sitecore\mehmet.vanli@sitecore.com
    - ID: "56a52337-177b-46b4-ae72-6b9083bb6700"
      Hint: Content
      Value: |
        <p>Les familles victoriennes peuvent désormais s'inscrire aux camps d'été 2026 de Y Victoria, dont le programme commence le lundi 14 décembre 2026 dans des lieux de camp à travers le Victoria. Conçus pour les enfants et les jeunes âgés de 8 à 16 ans, les camps offrent une expérience de vacances d'été remplie d'aventure, d'activités de plein air, de nouvelles amitiés et de nombreuses opportunités d'essayer quelque chose de nouveau.</p><p>Les camps sont construits autour de l'engagement du Y à créer des espaces accueillants où les jeunes se sentent soutenus, inclus et encouragés à essayer. Les campeurs peuvent s'attendre à un mélange de travail d'équipe, de créativité et de temps dans la nature, avec des activités conçues pour les aider à renforcer leur confiance, à développer leur indépendance et à créer des souvenirs durables. Que ce soit avec des amis ou en solo, l'expérience est axée sur l'appartenance, le plaisir et la croissance personnelle.</p><p>Pour Y Victoria, le programme fait partie d'une mission bien plus grande. En tant qu'organisation à but non lucratif, le Y réinvestit dans des programmes qui aident les communautés à prospérer, avec un fort accent sur l'autonomisation des jeunes, des communautés saines et la connexion. Les camps d'été sont un moyen pour le Y d'aider les jeunes à s'éloigner des écrans et à vivre des expériences partagées significatives qui peuvent avoir un impact réel bien après la fin des vacances.</p><p>"Le camp d'été donne aux jeunes l'occasion de découvrir ce dont ils sont capables, de nouer de nouvelles connexions et de se sentir partie prenante de quelque chose de plus grand", a déclaré un responsable de programme de Y Victoria. "C'est incroyable de voir la confiance qu'ils acquièrent en seulement quelques jours."</p><p>Les places devraient se remplir rapidement, il est donc conseillé aux familles de s'inscrire tôt pour la saison 2026. Pour en savoir plus et réserver une place, visitez le site Web de Y Victoria et rendez-vous dès aujourd'hui dans la section Camps.</p>
