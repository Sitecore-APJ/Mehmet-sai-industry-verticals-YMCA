        <div class="ck-content"><h2 style="-webkit-font-smoothing:antialiased !important;-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(55, 55, 55);font-family:HelveticaNeueLTPro-Bd, Arial, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Inspiring and empowering young people and communities to thrive</h2><p style="-webkit-font-smoothing:antialiased !important;-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(55, 55, 55);font-family:HelveticaNeueLTPro-Roman, Arial, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">The YMCA is one of the world's longest-running and largest youth-focused movements. Y Victoria has been supporting communities for more than 170 years.</p><p style="-webkit-font-smoothing:antialiased !important;-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(55, 55, 55);font-family:HelveticaNeueLTPro-Roman, Arial, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">We offer a wide range of programs and services that support children and young people across their life cycle – from early learning and kindergarten programs and <a style="-webkit-font-smoothing:antialiased !important;background-color:transparent;box-sizing:border-box;color:rgb(240, 32, 32);text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;" href="https://victoria.ymca.org.au/programs-services/recreation/swimming-lessons">teaching kids to swim</a>, through to empowering young people at our youth hubs and offering meaningful career pathways. We also provide recreation and other supports for older Australians.</p><p style="-webkit-font-smoothing:antialiased !important;-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(55, 55, 55);font-family:HelveticaNeueLTPro-Roman, Arial, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Y Victoria is a not-for-profit organisation, meaning that all we receive is put back into improving our <a style="-webkit-font-smoothing:antialiased !important;background-color:transparent;box-sizing:border-box;color:rgb(240, 32, 32);text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;" href="https://victoria.ymca.org.au/programs-services">programs and services</a>&nbsp;and into <a style="-webkit-font-smoothing:antialiased !important;background-color:transparent;box-sizing:border-box;color:rgb(240, 32, 32);text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;" href="https://victoria.ymca.org.au/support-the-y/ymca-open-doors">supporting local communities</a>.</p><p style="-webkit-font-smoothing:antialiased !important;-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(55, 55, 55);font-family:HelveticaNeueLTPro-Roman, Arial, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">With over 5,000 <a style="-webkit-font-smoothing:antialiased !important;background-color:transparent;box-sizing:border-box;color:rgb(240, 32, 32);text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;" href="https://victoria.ymca.org.au/staff-and-volunteers">staff and volunteers</a>, we deliver services at more than 150 locations every day, including Action Sports, Camps, Children's Programs, Recreation and Youth Services. We also offer&nbsp;<a style="-webkit-font-smoothing:antialiased !important;background-color:transparent;box-sizing:border-box;color:rgb(240, 32, 32);text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;" href="https://victoria.ymca.org.au/facility-hire">spaces for hire</a>&nbsp;to help bring communities together.</p><p style="-webkit-font-smoothing:antialiased !important;-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(55, 55, 55);font-family:HelveticaNeueLTPro-Roman, Arial, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Y Victoria is <a style="-webkit-font-smoothing:antialiased !important;background-color:transparent;box-sizing:border-box;color:rgb(240, 32, 32);text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;" href="https://victoria.ymca.org.au/about-us">part of the wider Y story</a>.&nbsp;<a style="-webkit-font-smoothing:antialiased !important;background-color:transparent;box-sizing:border-box;color:rgb(240, 32, 32);text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;" href="https://annualreport.ymca.org.au/our-impact" rel="noopener noreferrer">Our impact</a> has changed the lives of thousands of young people and Victorians.</p><p style="-webkit-font-smoothing:antialiased !important;-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(55, 55, 55);font-family:HelveticaNeueLTPro-Roman, Arial, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="-webkit-font-smoothing:antialiased !important;box-sizing:border-box;font-family:HelveticaNeueLTPro-Bd, Arial, sans-serif;font-weight:400;text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;">Get involved through our </strong><a style="-webkit-font-smoothing:antialiased !important;background-color:transparent;box-sizing:border-box;color:rgb(240, 32, 32);text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;" href="https://victoria.ymca.org.au/partnerships"><strong style="-webkit-font-smoothing:antialiased !important;box-sizing:border-box;font-family:HelveticaNeueLTPro-Bd, Arial, sans-serif;font-weight:400;text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;">partnerships</strong></a><strong style="-webkit-font-smoothing:antialiased !important;box-sizing:border-box;font-family:HelveticaNeueLTPro-Bd, Arial, sans-serif;font-weight:400;text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;">&nbsp;and by </strong><a style="-webkit-font-smoothing:antialiased !important;background-color:transparent;box-sizing:border-box;color:rgb(240, 32, 32);text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;" href="https://victoria.ymca.org.au/support-the-y/donate"><strong style="-webkit-font-smoothing:antialiased !important;box-sizing:border-box;font-family:HelveticaNeueLTPro-Bd, Arial, sans-serif;font-weight:400;text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;">donating to the Y</strong></a><strong style="-webkit-font-smoothing:antialiased !important;box-sizing:border-box;font-family:HelveticaNeueLTPro-Bd, Arial, sans-serif;font-weight:400;text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;">.</strong></p></div>
