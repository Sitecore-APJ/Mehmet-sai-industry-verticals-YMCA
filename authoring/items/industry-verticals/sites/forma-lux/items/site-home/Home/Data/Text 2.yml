        <div class="ck-content"><h2 style="-webkit-font-smoothing:antialiased !important;-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(55, 55, 55);font-family:HelveticaNeueLTPro-Bd, Arial, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-rendering:optimizelegibility !important;text-shadow:rgba(0, 0, 0, 0.004) 1px 1px 1px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Inspiring and empowering young people and communities to thrive</h2><p>The YMCA is one of the world's longest-running and largest youth-focused movements. Y Victoria has been supporting communities for more than 170 years.</p><p>We offer a wide range of programs and services that support children and young people across their life cycle – from early learning and kindergarten programs and teaching kids to swim, through to empowering young people at our youth hubs and offering meaningful career pathways. We also provide recreation and other supports for older Australians.</p><p>Y Victoria is a not-for-profit organisation, meaning that all we receive is put back into improving our programs and services&nbsp;and into supporting local communities.</p><p>With over 5,000 staff and volunteers, we deliver services at more than 150 locations every day, including Action Sports, Camps, Children's Programs, Recreation and Youth Services. We also offer&nbsp;spaces for hire&nbsp;to help bring communities together.</p><p>Y Victoria is part of the wider Y story.&nbsp;Our impact has changed the lives of thousands of young people and Victorians.</p><p>Get involved through our partnerships&nbsp;and by donating to the Y.</p></div>
